[project]
name = "strawberry-workspace"
version = "0.0.0"
description = "uv workspace root (not a package). Members are listed in tool.uv.workspace."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.0",
  "mypy==1.18.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "contracts/gen/python",
]

[tool.uv.sources]
tbcontracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["contracts/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["contracts/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["contracts/gen/"]
