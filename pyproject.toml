[project]
name = "strawberry-workspace"
version = "0.0.0"
description = "uv workspace root (not a package). Members are listed in tool.uv.workspace."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "httpx==0.28.1",
  "hypothesis==6.170.1",
  # Calendar generation only (scripts/gen_calendar.py); runtime code reads the generated file.
  "exchange-calendars==4.13.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "contracts/gen/python",
  "libs/py/tbcore",
  "services/assistant",
  "services/backtest",
  "services/broker-gateway-ibkr",
  "services/context-data",
  "services/ml",
  "services/monitor",
  "services/optimizer",
  "services/strategy-runtime",
]

[tool.uv.sources]
tbcontracts = { workspace = true }
tbcore = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "libs/py/tbcore/tests", "services/backtest/tests", "services/ml/tests", "services/broker-gateway-ibkr/ibkr_tests", "services/context-data/ctx_tests", "services/monitor/tests", "services/strategy-runtime/tests", "tests/python"]
addopts = "-q -m 'not ibkr_paper and not ctx_live'"
markers = [
  "perf: performance targets (opt-in with TB_PERF=1)",
  "ibkr_paper: needs a real IB Gateway paper session (opt-in: TB_IBKR_PAPER_TEST=1, run with -m ibkr_paper)",
  "ctx_live: calls real context-data APIs (opt-in: TB_CTX_LIVE_TEST=1, run with -m ctx_live)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["contracts/gen", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["tbcore", "tb"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["S603", "S607"]
# Seeded pseudo-random data in tests is deliberate (reproducible fixtures), never security-relevant.
"**/tests/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "contracts/gen/python/src:libs/py/tbcore/src:services/assistant/src:services/backtest/src:services/broker-gateway-ibkr/src:services/broker-gateway-ibkr:services/context-data:services/context-data/src:services/ml/src:services/monitor/src:services/optimizer/src:services/strategy-runtime/src"
explicit_package_bases = true
files = ["libs/py/tbcore/src", "libs/py/tbcore/tests", "services/backtest/tests", "services/ml/tests", "contracts/tests", "services/*/src", "services/broker-gateway-ibkr/ibkr_tests", "services/context-data/ctx_tests", "tests/python"]
exclude = ["contracts/gen/"]

[[tool.mypy.overrides]]
# ib_async ships py.typed but its event and dataclass APIs are only partially annotated.
module = ["ib_async", "ib_async.*", "nats", "nats.*", "asyncpg", "asyncpg.*", "grpc", "grpc.*", "grpc_status", "grpc_status.*", "google.rpc.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# grpcio's Python API is untyped (no published stubs for grpc.aio generic handlers / grpc_status).
module = ["tb_broker_ibkr.grpc_service", "ibkr_tests.test_grpc", "ibkr_tests.test_main", "ibkr_tests.test_journal_pg", "ctx_tests.test_engine"]
disallow_untyped_calls = false
disable_error_code = ["type-arg", "no-any-return"]

[[tool.mypy.overrides]]
# grpcio's sync server and channel APIs are untyped (rpc helpers, ML and optimizer gRPC adapters, their tests).
module = ["tbcore.rpc", "tb_ml.*", "tb_optimizer.*", "services.ml.tests.*", "services.optimizer.tests.*", "test_ml_service"]
disallow_untyped_calls = false
disable_error_code = ["type-arg", "no-any-return", "attr-defined"]

[[tool.mypy.overrides]]
module = ["google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf modules ship .pyi stubs but no py.typed marker (namespace package).
module = "tb.*"
follow_untyped_imports = true
