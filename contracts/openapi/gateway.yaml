openapi: 3.1.0
info:
  title: Strawberry api-gateway
  version: 0.1.0
  description: |
    REST + SSE API between the web UI and api-gateway (D3, D14). Every route requires a session cookie
    except those tagged `public` (SE-004). State-changing requests require an allowed `Origin` and an
    `X-CSRF-Token` header equal to the `tb_csrf` cookie (SE-006). A 403 with `error: step_up_required`
    means the UI must run a step-up and retry (SE-003).

    Trading resources (`/api/v1/trading`, `/accounts`, `/strategies`, `/risk-limits`, `/orders`,
    `/intents`, `/fills`, `/trace`, `/kill-switches`, `/instruments`, `/bars`) return the canonical
    protojson form of the named `tb.*` contract message (lowerCamelCase names, unpopulated fields
    emitted, unset messages as null): decimals are `{ "value": "<decimal string>" }`, int64 timestamps
    are UTC-nanosecond strings, enums are full names (ADR-0028). The web UI types them with the
    generated `*Json` types from `contracts/gen/ts`. Upstream outages answer 503 `<service>_unavailable`.

    Two more listeners are not part of this API and never share its address (ADR-0051, ADR-0052):
    the internal listener (`TB_INTERNAL_HTTP_ADDR`, backend network only) serves
    `POST /internal/alertmanager/webhook` (bearer token; Alertmanager v4 payload → Web Push, SE-063),
    and the optional TradingView listener (`TB_TV_WEBHOOK_ADDR`, reached only through the dedicated
    Cloudflare Access hostname) serves `POST /webhooks/tradingview/{name}` with the JSON alert body
    `{secret, ticker, action: buy|sell|exit, time (RFC 3339), price?, alert_id?, comment?}` and turns
    it into a `tb.signals.v1.Signal` for strategy `tv-{name}` (SE-064). Both also answer `GET /healthz`.
servers:
  - url: /
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-tb_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    StepUpRequired:
      type: object
      required: [error, method]
      properties:
        error: { const: step_up_required }
        method: { enum: [passkey, any] }
        action: { type: string }
    CeremonyBegin:
      type: object
      properties:
        ceremony_id: { type: string }
        options: { type: object, description: WebAuthn PublicKeyCredentialCreation/RequestOptions JSON }
    CeremonyFinish:
      type: object
      required: [ceremony_id, credential]
      additionalProperties: false
      properties:
        ceremony_id: { type: string }
        name: { type: string }
        credential: { type: object, description: WebAuthn credential JSON (base64url fields) }
    Code:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }
    ManualOrder:
      type: object
      required: [broker_account_id, instrument_id, side, quantity, order_type, tif]
      additionalProperties: false
      properties:
        broker_account_id: { type: string }
        instrument_id: { type: string }
        side: { enum: [buy, sell, sell_short] }
        quantity: { type: string, description: positive decimal string }
        order_type: { enum: [market, limit] }
        limit_price: { type: string, description: required for limit orders }
        tif: { enum: [day, gtc] }
        extended_hours: { type: boolean }
        reason: { type: string, maxLength: 300 }
        intent_id: { type: string, description: client ULID reused on retry (idempotent, OE-006) }
  responses:
    Unauthorized: { description: No valid session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:
      description: Denied or step-up required
      content:
        application/json:
          schema:
            oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/StepUpRequired' }]
    Locked: { description: Rate limited or locked out (SE-011) }
security:
  - session: []
tags:
  - name: public
    description: Reachable without a session (SE-004 allowlist)
paths:
  /healthz:
    get: { tags: [public], security: [], responses: { '200': { description: ok } } }
  /auth/state:
    get:
      tags: [public]
      security: []
      responses:
        '200':
          description: Setup and session state
          content: { application/json: { schema: { type: object, properties: { setup_required: { type: boolean }, authenticated: { type: boolean }, rp_id: { type: string } } } } }
  /auth/setup/begin:
    post:
      tags: [public]
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [setup_token], properties: { setup_token: { type: string }, display_name: { type: string } } } } } }
      responses: { '200': { description: Creation options, content: { application/json: { schema: { $ref: '#/components/schemas/CeremonyBegin' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Setup closed } }
  /auth/setup/finish:
    post:
      tags: [public]
      security: []
      requestBody: { content: { application/json: { schema: { type: object, required: [setup_token, ceremony_id, credential], properties: { setup_token: { type: string }, ceremony_id: { type: string }, display_name: { type: string }, passkey_name: { type: string }, credential: { type: object } } } } } }
      responses: { '200': { description: Owner created; recovery codes shown once, content: { application/json: { schema: { type: object, properties: { recovery_codes: { type: array, items: { type: string } } } } } } } }
  /auth/webauthn/login/begin:
    post: { tags: [public], security: [], responses: { '200': { description: Request options, content: { application/json: { schema: { $ref: '#/components/schemas/CeremonyBegin' } } } }, '429': { $ref: '#/components/responses/Locked' } } }
  /auth/webauthn/login/finish:
    post: { tags: [public], security: [], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CeremonyFinish' } } } }, responses: { '200': { description: Session started }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/Locked' } } }
  /auth/totp/login:
    post: { tags: [public], security: [], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Code' } } } }, responses: { '200': { description: Reduced-assurance session (SE-014) }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/Locked' } } }
  /auth/recovery:
    post: { tags: [public], security: [], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Code' } } } }, responses: { '200': { description: Reduced-assurance session; code consumed }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /auth/me:
    get: { responses: { '200': { description: Owner, session, passkeys, TOTP and recovery status }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /auth/logout:
    post: { responses: { '204': { description: Session revoked } } }
  /auth/webauthn/register/begin:
    post: { responses: { '200': { description: Creation options }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /auth/webauthn/register/finish:
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CeremonyFinish' } } } }, responses: { '201': { description: Passkey added }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /auth/webauthn/credentials/{id}:
    delete: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Deleted }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Last passkey } } }
  /auth/totp/enroll:
    post: { responses: { '200': { description: otpauth URL and secret (shown once) }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /auth/totp/verify:
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Code' } } } }, responses: { '200': { description: TOTP enabled } } }
  /auth/recovery/regenerate:
    post: { responses: { '200': { description: New recovery codes (old ones invalidated) }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /auth/step-up/begin:
    post: { responses: { '200': { description: Request options for the owner's passkeys } } }
  /auth/step-up/finish:
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CeremonyFinish' } } } }, responses: { '200': { description: Passkey step-up granted for the window } } }
  /auth/step-up/totp:
    post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Code' } } } }, responses: { '200': { description: TOTP step-up (recovery actions only) } } }
  /auth/sessions:
    get: { responses: { '200': { description: Active sessions } } }
  /auth/sessions/{id}:
    delete: { parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Revoked } } }
  /api/v1/audit:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: before_seq, in: query, schema: { type: integer } }
      responses: { '200': { description: Audit events, newest first } }
  /api/v1/audit/verify:
    get: { responses: { '200': { description: Hash-chain verification result } } }
  /api/v1/settings:
    get: { responses: { '200': { description: Known settings with values and versions } } }
  /api/v1/settings/{key}:
    put:
      parameters: [{ name: key, in: path, required: true, schema: { enum: [ui.theme, trading.live_enabled, mobile.order_entry_enabled, assistant.write_tools_enabled, alerts.push_fills_enabled] } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [value, version], additionalProperties: false, properties: { value: {}, version: { type: integer } } } } } }
      responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Version conflict } }
  /api/v1/broker/credentials:
    get: { responses: { '200': { description: Credential metadata only (never secrets) }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/broker/credentials/{account}/{environment}:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' } }
      - { name: environment, in: path, required: true, schema: { enum: [paper, live] } }
    put:
      requestBody: { content: { application/json: { schema: { type: object, required: [broker, secret], additionalProperties: false, properties: { broker: { enum: [alpaca, ibkr] }, secret: { type: object, additionalProperties: { type: string }, maxProperties: 8 } } } } } }
      responses: { '200': { description: Stored (metadata returned) }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete: { responses: { '204': { description: Deleted }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/system/status:
    get: { responses: { '200': { description: "Trading-status snapshot: environment, live flag, mode, session expiry, `trading` (tb.orders.v1.TradingStatus, null with `trading_error` when execution is unreachable; UI-013), and `feeds` (tb.marketdata.v1.GetFeedStatusResponse, null with `feeds_error` when marketdata is unreachable)" } } }
  /api/v1/events:
    get:
      description: Server-sent events (D14). Events `trading-status` (JSON snapshot) and `session-ended`. Supports `Last-Event-ID`.
      responses: { '200': { description: text/event-stream } }
  /api/v1/trading/status:
    get: { responses: { '200': { description: tb.orders.v1.GetTradingStatusResponse } } }
  /api/v1/accounts:
    get: { responses: { '200': { description: tb.ledger.v1.ListAccountsResponse (AccountView per broker account) } } }
  /api/v1/accounts/{account}:
    parameters: [{ name: account, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' } }]
    get: { responses: { '200': { description: tb.ledger.v1.GetAccountViewResponse } } }
  /api/v1/accounts/{account}/lots:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string } }
      - { name: owner, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
      - { name: instrument_id, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
    get: { responses: { '200': { description: tb.ledger.v1.ListLotsResponse } } }
  /api/v1/accounts/{account}/breaks:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string } }
      - { name: open_only, in: query, schema: { type: boolean } }
    get: { responses: { '200': { description: tb.ledger.v1.ListBreaksResponse } } }
  /api/v1/accounts/{account}/breaks/{id}/resolve:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      description: Owner break resolution (VP-019); action `ledger.break.resolve` needs a passkey step-up.
      requestBody: { content: { application/json: { schema: { type: object, required: [resolution], additionalProperties: false, properties: { resolution: { enum: [accept, transfer_to_manual, book_to_manual, rebaseline_cash] }, from_owner: { type: string }, qty: { type: string }, note: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { description: tb.ledger.v1.ResolveBreakResponse }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/accounts/{account}/reconciliations:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
    get: { responses: { '200': { description: tb.ledger.v1.ListReconciliationReportsResponse } } }
  /api/v1/strategies:
    get: { responses: { '200': { description: tb.orders.v1.ListStrategiesResponse } } }
  /api/v1/strategies/{id}/portfolio:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { responses: { '200': { description: tb.ledger.v1.GetStrategyPortfolioResponse } } }
  /api/v1/strategies/{id}/equity:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: account, in: query, required: true, schema: { type: string } }
    get: { responses: { '200': { description: tb.ledger.v1.GetEquityCurveResponse } } }
  /api/v1/strategies/{id}/mode:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      description: disabled, shadow, or paper only; live is rejected (go-live flow, SM-004, UI-014).
      requestBody: { content: { application/json: { schema: { type: object, required: [mode], additionalProperties: false, properties: { mode: { enum: [disabled, shadow, paper] }, reason: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.orders.v1.SetStrategyModeResponse } }
  /api/v1/strategies/{id}/allocation:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      description: Increases need a passkey step-up (`allocation.increase`, RM-007).
      requestBody: { content: { application/json: { schema: { type: object, required: [amount], additionalProperties: false, properties: { amount: { type: string, pattern: '^\d{1,15}(\.\d{1,8})?$' } } } } } }
      responses: { '200': { description: tb.ledger.v1.SetAllocationResponse }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/risk-limits/{scope}:
    parameters: [{ name: scope, in: path, required: true, schema: { type: string, pattern: '^(global|manual|account:[a-z0-9_-]{1,64}|strategy:[A-Za-z0-9_-]{1,64})$' } }]
    get: { responses: { '200': { description: tb.orders.v1.GetRiskLimitsResponse (scope limits and effective values) } } }
    put:
      description: Replaces the scope's limits with the tb.orders.v1.RiskLimits body (protojson). Loosening any field needs a passkey step-up (`risk.limits.raise`, RM-007).
      responses: { '200': { description: tb.orders.v1.SetRiskLimitsResponse }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/orders:
    get:
      parameters:
        - { name: account, in: query, schema: { type: string } }
        - { name: strategy_id, in: query, schema: { type: string } }
        - { name: open_only, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000 } }
      responses: { '200': { description: tb.orders.v1.ListOrdersResponse } }
    post:
      description: Manual order through the pre-trade gate (RM-001, UI-015). Live or unknown-environment accounts need a passkey step-up; phones need `mobile.order_entry_enabled`.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ManualOrder' } } } }
      responses: { '200': { description: tb.orders.v1.SubmitIntentResponse }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/orders/preview:
    post:
      description: Dry-run decision, estimated price and notional, and ownership note (no reservation, no order).
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ManualOrder' } } } }
      responses: { '200': { description: tb.orders.v1.PreviewIntentResponse } }
  /api/v1/intents:
    get:
      parameters:
        - { name: strategy_id, in: query, schema: { type: string } }
        - { name: rejected_only, in: query, schema: { type: boolean } }
        - { name: since, in: query, description: received at or after (UTC ns), schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000 } }
      responses: { '200': { description: tb.orders.v1.ListIntentsResponse } }
  /api/v1/intents/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete: { description: Cancel the intent's open orders (`orders.cancel`)., responses: { '200': { description: tb.orders.v1.CancelIntentResponse } } }
  /api/v1/fills:
    get:
      parameters:
        - { name: account, in: query, schema: { type: string } }
        - { name: strategy_id, in: query, schema: { type: string } }
        - { name: instrument_id, in: query, schema: { type: string } }
        - { name: since, in: query, description: executed at or after (UTC ns), schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000 } }
      responses: { '200': { description: tb.orders.v1.ListFillsResponse } }
  /api/v1/trace/{id}:
    parameters: [{ name: id, in: path, required: true, description: correlation ID, schema: { type: string } }]
    get: { responses: { '200': { description: tb.orders.v1.GetTraceResponse } } }
  /api/v1/kill-switches:
    get:
      parameters: [{ name: all, in: query, description: include released switches, schema: { type: boolean } }]
      responses: { '200': { description: tb.orders.v1.ListKillSwitchesResponse } }
    post:
      description: Engage a latched kill switch (RM-006, UI-006). No step-up from a desktop; from a phone a fresh passkey step-up (RM-020, `step_up_required` with method `passkey`).
      requestBody: { content: { application/json: { schema: { type: object, required: [scope], additionalProperties: false, properties: { scope: { enum: [global, account, strategy, instrument] }, target: { type: string }, action: { enum: [freeze, cancel_open, flatten], default: cancel_open }, reason: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.orders.v1.TriggerKillSwitchResponse } }
  /api/v1/kill-switches/{id}/release:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      description: Release needs a fresh passkey step-up from a desktop client (RM-007); phones get 403 `desktop_required`.
      requestBody: { content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.orders.v1.ReleaseKillSwitchResponse }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/instruments/resolve:
    get:
      parameters: [{ name: symbols, in: query, required: true, description: 1-50 comma-separated tickers, schema: { type: string } }]
      responses: { '200': { description: tb.marketdata.v1.ResolveSymbolsResponse (UI-011) } }
  /api/v1/bars:
    get:
      parameters:
        - { name: instrument_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: timeframe, in: query, required: true, schema: { enum: ['1m', '5m', '15m', '30m', '1h', '1d'] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
      responses: { '200': { description: tb.marketdata.v1.GetBarsResponse (UI-010) } }
  /api/v1/stream/market:
    get:
      description: "SSE chart stream (UI-012, UI-049): `ready`, `bar` (final or corrected tb.marketdata.v1.Bar), `partial` (≤4 Hz), `fill` (tb.orders.v1.ExecutionReport in the instrument), `signal` (tb.signals.v1.Signal for the instrument), `resync` (client fell behind; reload history), `session-ended`."
      parameters:
        - { name: instrument_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: timeframe, in: query, required: true, schema: { enum: ['1m', '5m', '15m', '30m', '1h', '1d'] } }
      responses: { '200': { description: text/event-stream } }
  # ---- section 14 Phase 5: signals, Web Push, TradingView (ADR-0050..ADR-0052) ----
  /api/v1/instruments/{id}/freshness:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }]
    get: { description: 'Per timeframe (1m..1d): marketdata IsFresh (RM-004) for the data explorer (UI-051); a failed timeframe carries `error`, never `fresh: true`.', responses: { '200': { description: '{"instrument_id", "timeframes": [{timeframe, fresh, last_bar_close (UTC ns), reason, error?}]}' } } }
  /api/v1/signals:
    get:
      description: Recent model and webhook signals of one instrument for chart overlays (UI-049), from the JetStream SIGNALS stream (sig.<strategy_id>.<instrument_id>). Signals are never orders.
      parameters:
        - { name: instrument_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: since, in: query, description: 'UTC ns; default now − 24 h, at most 30 days back', schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000, default: 500 } }
      responses: { '200': { description: '{"signals": [tb.signals.v1.Signal]} oldest first (the newest `limit`)' }, '503': { description: bus_unavailable } }
  /api/v1/push/config:
    get: { description: Web Push configuration (SE-060); `enabled` is false without a VAPID key., responses: { '200': { description: '{"enabled": bool, "vapid_public_key": base64url, "redact": bool}' } } }
  /api/v1/push/subscriptions:
    get: { description: 'Subscribed devices: id, label, service (push host), endpoint_hash, created_at, last_success_at, last_error, failures. Never the endpoint or keys (SE-061).', responses: { '200': { description: '{"subscriptions": [...]}' } } }
    post:
      description: Store this browser's PushSubscription (endpoint https on an allowed push service; p256dh 65-byte point; auth 16 bytes; sealed at rest; audited).
      requestBody: { content: { application/json: { schema: { type: object, required: [endpoint, p256dh, auth], additionalProperties: false, properties: { endpoint: { type: string, maxLength: 1024 }, p256dh: { type: string }, auth: { type: string }, label: { type: string, maxLength: 60 } } } } } }
      responses: { '200': { description: '{"id": ULID}' }, '400': { description: bad_endpoint or bad_request }, '503': { description: push_disabled } }
  /api/v1/push/subscriptions/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete: { responses: { '204': { description: Removed (audited) }, '404': { description: not_found } } }
  /api/v1/push/test:
    post: { description: Send a test notification to every subscribed device., responses: { '200': { description: '{"sent": int, "failed": int}' }, '503': { description: push_disabled } } }
  /api/v1/tradingview:
    get: { description: 'TradingView intake status (UI-048): enabled, public_url, access_jwt_required, allowed_ips, max_age_seconds, widget_enabled, tv-<name> strategies with their webhook path, recent deliveries from the audit log. Never a secret (SE-064).', responses: { '200': { description: JSON } } }
  # ---- research (section 14 Phase 4 slice: training, experiments, tearsheets; ADR-0035) ----
  # Bodies and responses are the canonical protojson of tb.ml.v1 / tb.optimizer.v1 messages. The
  # gateway sets the caller (actor owner, step-up attestation only while a passkey step-up is fresh).
  /api/v1/research/families:
    get: { responses: { '200': { description: tb.ml.v1.ListModelFamiliesResponse (hyperparameter JSON Schemas for forms, UI-023) } } }
  /api/v1/research/feature-sets:
    get: { responses: { '200': { description: tb.ml.v1.ListFeatureSetsResponse } } }
  /api/v1/research/label-presets:
    get: { responses: { '200': { description: tb.ml.v1.ListLabelPresetsResponse } } }
  /api/v1/research/training/estimate:
    post: { description: 'Body tb.ml.v1.TrainingConfig; validation errors or the cost estimate (ML-031).', responses: { '200': { description: tb.ml.v1.EstimateTrainingJobResponse } } }
  /api/v1/research/training/jobs:
    get: { responses: { '200': { description: tb.ml.v1.ListJobsResponse } } }
    post: { description: 'Body tb.ml.v1.SubmitTrainingJobRequest (config, confirmOverBudget).', responses: { '200': { description: tb.ml.v1.SubmitTrainingJobResponse } } }
  /api/v1/research/training/jobs/{id}:
    get: { responses: { '200': { description: tb.ml.v1.GetJobResponse } } }
  /api/v1/research/training/jobs/{id}/cancel:
    post: { responses: { '200': { description: tb.ml.v1.CancelJobResponse } } }
  /api/v1/research/training/jobs/{id}/stream:
    get: { description: 'SSE: `progress` (tb.ml.v1.JobProgress, id = seq; resume with Last-Event-ID), `done`.', responses: { '200': { description: text/event-stream } } }
  /api/v1/research/runs:
    get: { responses: { '200': { description: tb.ml.v1.ListRunsResponse } } }
  /api/v1/research/runs/{id}:
    get: { responses: { '200': { description: tb.ml.v1.GetRunResponse } } }
  /api/v1/research/runs/{id}/diagnostics:
    get: { responses: { '200': { description: tb.ml.v1.GetDiagnosticsResponse } } }
  /api/v1/research/runs/{id}/model-card:
    get: { responses: { '200': { description: tb.ml.v1.GetModelCardResponse } } }
  /api/v1/research/runs/{id}/importance:
    get: { parameters: [{ name: method, in: query, schema: { enum: [gain, permutation, shap] } }], responses: { '200': { description: tb.ml.v1.GetFeatureImportanceResponse } } }
  /api/v1/research/runs/{id}/tearsheet:
    get: { description: 'Static HTML document with a sandboxed CSP (no scripts, UI-025); open as its own page.', responses: { '200': { description: text/html } } }
  /api/v1/research/runs/{id}/register:
    post: { description: 'Body {"name"}.', responses: { '200': { description: tb.ml.v1.RegisterModelResponse } } }
  /api/v1/research/runs/{id}/ablations:
    post: { description: 'Body tb.ml.v1.SubmitAblationRequest (variants).', responses: { '200': { description: tb.ml.v1.SubmitAblationResponse } } }
  /api/v1/research/lineages:
    get: { responses: { '200': { description: tb.optimizer.v1.ListLineagesResponse } } }
    post: { description: 'Body tb.optimizer.v1.Lineage.', responses: { '200': { description: tb.optimizer.v1.CreateLineageResponse } } }
  /api/v1/research/lineages/{id}:
    get: { responses: { '200': { description: tb.optimizer.v1.GetLineageResponse } } }
  /api/v1/research/lineages/{id}/autonomy:
    put: { description: 'Body tb.optimizer.v1.SetLineageAutonomyRequest; raising the level or budgets needs a passkey step-up (`analyst.autonomy.set`, EX-033).', responses: { '200': { description: tb.optimizer.v1.SetLineageAutonomyResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/research/lineages/{id}/deployment-limits:
    get: { responses: { '200': { description: tb.optimizer.v1.GetDeploymentLimitsResponse (the lineage's limits or the horizon default, EX-062) } } }
    put: { description: 'Body tb.optimizer.v1.SetDeploymentLimitsRequest (limits, allocation, reason); raising a limit or the allocation needs a passkey step-up (`research.deployment_limits.set`, RM-007).', responses: { '200': { description: tb.optimizer.v1.SetDeploymentLimitsResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/research/lineages/{id}/cycles:
    post: { description: 'Opens a MinBTL research cycle; passkey step-up (`research.cycle.open`, EX-025).', responses: { '200': { description: tb.optimizer.v1.OpenCycleResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/research/lineages/{id}/ledger:
    get: { responses: { '200': { description: tb.optimizer.v1.GetTrialLedgerResponse } } }
  /api/v1/research/lineages/{id}/stats:
    get: { responses: { '200': { description: tb.optimizer.v1.GetCumulativeOverfittingStatsResponse } } }
  /api/v1/research/lineages/{id}/holdout:
    get: { responses: { '200': { description: tb.optimizer.v1.GetHoldoutStatusResponse (touch counter, UI-026) } } }
  /api/v1/research/lineages/{id}/holdout/boundary:
    post: { description: 'Body {"boundary"} (UTC ns, forward only); passkey step-up (`holdout.schedule`, EX-014).', responses: { '200': { description: tb.optimizer.v1.SetHoldoutBoundaryResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/research/lineages/{id}/retraining:
    put: { description: 'Body tb.optimizer.v1.RetrainingPolicy.', responses: { '200': { description: tb.optimizer.v1.SetRetrainingPolicyResponse } } }
  /api/v1/research/lineages/{id}/retrain:
    post: { responses: { '200': { description: tb.optimizer.v1.TriggerRetrainResponse } } }
  /api/v1/research/studies:
    get: { responses: { '200': { description: tb.optimizer.v1.ListStudiesResponse } } }
    post: { description: 'Body tb.optimizer.v1.StudySpec (with preregistration).', responses: { '200': { description: tb.optimizer.v1.CreateStudyResponse } } }
  /api/v1/research/studies/{id}:
    get: { responses: { '200': { description: tb.optimizer.v1.GetStudyResponse } } }
  /api/v1/research/studies/{id}/{action}:
    post: { description: 'action = start | pause | resume | stop.', responses: { '200': { description: tb.optimizer.v1.Study } } }
  /api/v1/research/studies/{id}/trials:
    get: { responses: { '200': { description: tb.optimizer.v1.ListTrialsResponse } } }
  /api/v1/research/studies/{id}/diagnostics:
    get: { responses: { '200': { description: tb.optimizer.v1.GetStudyDiagnosticsResponse } } }
  /api/v1/research/studies/{id}/stream:
    get: { description: 'SSE: `progress` (tb.optimizer.v1.StudyProgress), `done`.', responses: { '200': { description: text/event-stream } } }
  /api/v1/research/candidates:
    get: { parameters: [{ name: stage, in: query, schema: { enum: [validated, shadow, paper, live_eligible, retired] } }], responses: { '200': { description: tb.optimizer.v1.ListCandidatesResponse } } }
  /api/v1/research/candidates/{id}:
    get: { responses: { '200': { description: tb.optimizer.v1.GetCandidateResponse } } }
  /api/v1/research/candidates/{id}/gate-report:
    get: { responses: { '200': { description: tb.optimizer.v1.GetGateReportResponse } } }
  /api/v1/research/candidates/{id}/evidence:
    get: { parameters: [{ name: format, in: query, schema: { enum: [json, html] } }], responses: { '200': { description: tb.optimizer.v1.GetEvidencePackResponse or text/html } } }
  /api/v1/research/candidates/{id}/graph:
    get: { responses: { '200': { description: tb.optimizer.v1.GetLineageGraphResponse } } }
  /api/v1/research/candidates/{id}/check:
    post: { description: 'Body {"toStage"}; dry run of the permission table and gates (EX-032).', responses: { '200': { description: tb.optimizer.v1.CheckTransitionResponse } } }
  /api/v1/research/candidates/{id}/promote:
    post: { description: 'Body {"toStage": validated|shadow|paper|live_eligible}; paper and live_eligible need a passkey step-up (`model.promote`, N4); live is refused (section 15).', responses: { '200': { description: tb.optimizer.v1.PromoteCandidateResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/research/candidates/{id}/demote:
    post: { description: 'Body {"toStage": paper|retired, "reason"}.', responses: { '200': { description: tb.optimizer.v1.DemoteCandidateResponse } } }
  /api/v1/research/candidates/{id}/register:
    post: { description: 'Registers a shadow- or paper-stage candidate with execution (never live), sets its allocation in the ledger and its deployment limits in the strategy scope (SM-016, EX-064, RM-019); passkey step-up (`strategy.register`). 409 `wrong_stage` / `no_deployment` / `bad_limits`.', responses: { '200': { description: '{"strategy_id", "mode", "broker_account_id", "allocation", "limits_raised"}' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Conflict } } }
  /api/v1/research/candidates/{id}/holdout:
    post: { description: 'Body {"reason"}; passkey step-up (`holdout.evaluate`), one touch per family per quarter, pass/fail + DSR only (EX-011).', responses: { '200': { description: tb.optimizer.v1.EvaluateOnHoldoutResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  # ---- monitoring (section 13 Phase 5; ADR-0045, MN-030..MN-046, UI-028..UI-031) ----
  # Responses are the canonical protojson of tb.monitor.v1 messages; 503 `monitor_unavailable` while the monitor is down.
  /api/v1/monitoring/strategies:
    get: { responses: { '200': { description: tb.monitor.v1.ListStrategyHealthResponse } } }
  /api/v1/monitoring/strategies/{id}:
    get: { responses: { '200': { description: tb.monitor.v1.GetStrategyHealthResponse } } }
  /api/v1/monitoring/strategies/{id}/{report}:
    get:
      description: 'report = performance | drift | divergence (optional `date`, YYYY-MM-DD) | execution | feedback | graduation (section 15 evidence, MN-040) | actions; any other value is 404.'
      parameters: [{ name: date, in: query, schema: { type: string } }]
      responses: { '200': { description: 'tb.monitor.v1 Get{Performance,Drift,Divergence}Report, GetExecutionQuality, GetLiveFeedback, GetGraduationEvidence, or ListContainmentActions response' }, '404': { description: unknown report } }
  /api/v1/monitoring/alerts:
    get:
      parameters: [{ name: status, in: query, schema: { type: string } }, { name: severity, in: query, schema: { type: string } }, { name: since, in: query, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } }]
      responses: { '200': { description: tb.monitor.v1.ListAlertsResponse (MN-041) } }
  /api/v1/monitoring/alerts/{key}/ack:
    post:
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.monitor.v1.AckAlertResponse } }
  /api/v1/monitoring/alerts/{key}/silence:
    post:
      description: Creates an Alertmanager silence for the alert; passkey step-up (`alerts.silence`, MN-042).
      requestBody: { content: { application/json: { schema: { type: object, required: [durationSeconds, reason], properties: { durationSeconds: { type: integer, minimum: 1, maximum: 86400 }, reason: { type: string, minLength: 1, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.monitor.v1.SilenceAlertResponse }, '400': { description: Bad request }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/monitoring/daily-reports:
    get: { parameters: [{ name: date, in: query, schema: { type: string } }], responses: { '200': { description: tb.monitor.v1.GetDailyReportResponse (pre-market checklist, end-of-day summary) } } }
  /api/v1/monitoring/containment/actions:
    get: { parameters: [{ name: strategy_id, in: query, schema: { type: string } }], responses: { '200': { description: tb.monitor.v1.ListContainmentActionsResponse } } }
  /api/v1/monitoring/containment/policies/{id}:
    get: { description: 'id = a strategy ID or `default`.', responses: { '200': { description: tb.monitor.v1.GetContainmentPolicyResponse } } }
    put: { description: 'Body tb.monitor.v1.SetContainmentPolicyRequest (policy, reason); loosening a threshold or weakening an action needs a passkey step-up (`monitor.containment.set`, MN-036).', responses: { '200': { description: tb.monitor.v1.SetContainmentPolicyResponse }, '403': { $ref: '#/components/responses/Forbidden' } } }
  # ---- AI Research Analyst and assistant (section 14 Phase 4 slice; AN-060, AN-061, AN-073, AN-080) ----
  /api/v1/analyst/lineages:
    get: { responses: { '200': { description: tb.analyst.v1.ListLineagesResponse (loop status, autonomy, budgets, LLM spend) } } }
  /api/v1/analyst/lineages/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }]
    get: { responses: { '200': { description: tb.analyst.v1.GetLoopStatusResponse } } }
  /api/v1/analyst/lineages/{id}/journal:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      parameters: [{ name: limit, in: query, schema: { type: integer, maximum: 500 } }]
      responses: { '200': { description: tb.analyst.v1.GetJournalResponse (research journal, newest first) } }
  /api/v1/analyst/lineages/{id}/trials:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { responses: { '200': { description: tb.analyst.v1.GetTrialLedgerResponse (every trial with source and status, deflated outcome, cycle budget) } } }
  /api/v1/analyst/lineages/{id}/pause:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      requestBody: { content: { application/json: { schema: { type: object, required: [paused], additionalProperties: false, properties: { paused: { type: boolean }, reason: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.analyst.v1.SetLoopPausedResponse } }
  /api/v1/analyst/lineages/{id}/analyze:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      description: Opens an owner-requested analyst round (optional run, study, candidate, or strategy reference and a question).
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { refKind: { enum: [run, study, candidate, strategy] }, refId: { type: string }, question: { type: string, maxLength: 2000 } } } } } }
      responses: { '200': { description: tb.analyst.v1.RequestAnalysisResponse } }
  /api/v1/analyst/rounds/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { responses: { '200': { description: tb.analyst.v1.GetRoundResponse (diagnosis, ranked plan with config diffs, outcome, decision, summary) } } }
  /api/v1/analyst/rounds/{id}/review:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      description: Approve or reject plan actions (AN-060). At level 0 the gateway submits approved actions to the ml and optimizer services as the owner (with the round ID) and records the launches with the assistant.
      requestBody: { content: { application/json: { schema: { type: object, required: [actionIds, approve], additionalProperties: false, properties: { actionIds: { type: array, maxItems: 20, items: { type: string } }, approve: { type: boolean }, reason: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: tb.analyst.v1.ReviewActionsResponse } }
  /api/v1/analyst/proposals:
    get:
      parameters: [{ name: lineage, in: query, schema: { type: string } }]
      responses: { '200': { description: tb.analyst.v1.ListCodeProposalsResponse } }
  /api/v1/analyst/proposals/{id}/review:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      description: Approve (ready for a human merge; never applied automatically, AN-073) or reject a candidate feature.
      requestBody: { content: { application/json: { schema: { type: object, required: [approve], additionalProperties: false, properties: { approve: { type: boolean }, note: { type: string, maxLength: 1000 } } } } } }
      responses: { '200': { description: tb.analyst.v1.ReviewCodeProposalResponse } }
  /api/v1/assistant/conversations:
    get: { responses: { '200': { description: tb.analyst.v1.ListConversationsResponse } } }
    post:
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { title: { type: string, maxLength: 120 }, lineageId: { type: string } } } } } }
      responses: { '200': { description: tb.analyst.v1.CreateConversationResponse } }
  /api/v1/assistant/conversations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { responses: { '200': { description: tb.analyst.v1.GetConversationResponse } } }
  /api/v1/assistant/conversations/{id}/messages:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      description: Ask the assistant; the reply cites the run, study, round, or report IDs it used (AN-080).
      requestBody: { content: { application/json: { schema: { type: object, required: [content], additionalProperties: false, properties: { content: { type: string, minLength: 1, maxLength: 4000 } } } } } }
      responses: { '200': { description: tb.analyst.v1.PostMessageResponse } }
