syntax = "proto3";

// ExecutionService is served by `execution` (section 07, ADR-0025): the OMS, the pre-trade risk
// gate, strategy registry and modes, kill switches, and trading status. Rules OE-*, RM-*, SM-* in
// docs/business-logic/.
//
// Callers (service tokens, per-method allowlist SE-040): api-gateway (UI and owner actions),
// strategy-runtime publishes intents on the bus subject ord.intent instead of calling this service.
// Owner actions that need step-up (RM-007) are authorized by api-gateway through policy.Authorize;
// execution re-checks the caller and records the actor and step-up method in the audit log.
package tb.orders.v1;

import "tb/common/v1/common.proto";
import "tb/orders/v1/orders.proto";

service ExecutionService {
  // Runs the pre-trade gate and, when approved, submits through the OMS. Idempotent on intent_id:
  // a repeated intent returns the first decision (OE-006).
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
  // Dry run of the gate for the UI order ticket: no reservation, no order, no decision record.
  rpc PreviewIntent(PreviewIntentRequest) returns (PreviewIntentResponse);
  // Cancels every open order of one intent (platform orders only).
  rpc CancelIntent(CancelIntentRequest) returns (CancelIntentResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse);
  rpc ListFills(ListFillsRequest) returns (ListFillsResponse);
  // Signal → intent → decision → orders → fills for one correlation ID (UI trace view).
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
  // Creates or updates a registry entry. New strategies always start `disabled` or `paper` (N4).
  rpc RegisterStrategy(RegisterStrategyRequest) returns (RegisterStrategyResponse);
  // disabled | shadow | paper only; live is set by the section 15 go-live flow (SM-004).
  rpc SetStrategyMode(SetStrategyModeRequest) returns (SetStrategyModeResponse);
  rpc GetRiskLimits(GetRiskLimitsRequest) returns (GetRiskLimitsResponse);
  // Raising any limit needs step-up (RM-007), enforced by api-gateway and recorded here.
  rpc SetRiskLimits(SetRiskLimitsRequest) returns (SetRiskLimitsResponse);
  // Engage needs no step-up; it latches (RM-006).
  rpc TriggerKillSwitch(TriggerKillSwitchRequest) returns (TriggerKillSwitchResponse);
  // Release needs desktop step-up (RM-007, UI-012).
  rpc ReleaseKillSwitch(ReleaseKillSwitchRequest) returns (ReleaseKillSwitchResponse);
  rpc ListKillSwitches(ListKillSwitchesRequest) returns (ListKillSwitchesResponse);
  rpc GetTradingStatus(GetTradingStatusRequest) returns (GetTradingStatusResponse);
  // Automatic containment (section 13, RM-018, SM-006): only ever reduces risk. live → paper
  // through a latched strategy kill switch with action demote_to_paper; shadow or paper → halted
  // with the strategy's open non-protective orders canceled; halted or disabled → unchanged.
  // Callers: monitor, api-gateway. Idempotent; re-promotion is always a manual owner action.
  rpc DemoteStrategy(DemoteStrategyRequest) returns (DemoteStrategyResponse);


  // ---- Section 15 go-live (ADR-0054, GL-*). The only path to StrategyMode LIVE.
  // Live status: the deploy flag, every live-environment account with its audited enablement and
  // adapter session, live strategies with their caps and ladder, and paper strategies' graduation.
  rpc GetLiveStatus(GetLiveStatusRequest) returns (GetLiveStatusResponse);
  // Readiness checklist of one live account (GL-010): owner-attested items plus automated checks.
  rpc GetLiveReadiness(GetLiveReadinessRequest) returns (GetLiveReadinessResponse);
  // Owner marks one attested checklist item passed or failed (never a waiver).
  rpc SetReadinessItem(SetReadinessItemRequest) returns (SetReadinessItemResponse);
  // Graduation report for a paper strategy, computed from recorded paper results only (GL-001).
  rpc GetGraduationReport(GetGraduationReportRequest) returns (GetGraduationReportResponse);
  // Enables a live account: deploy flag, complete readiness record, live credential connection-tested
  // read-only, owner with a fresh passkey step-up and a typed confirmation (GL-011). Writes the
  // audited broker.live_enablement row the live adapter gate reads (BR-013).
  rpc EnableLiveAccount(EnableLiveAccountRequest) returns (EnableLiveAccountResponse);
  // Disables a live account: enablement off, account kill switch (freeze + cancel platform orders,
  // never manual positions), every live strategy on it demoted to paper (GL-031). No step-up.
  rpc DisableLiveAccount(DisableLiveAccountRequest) returns (DisableLiveAccountResponse);
  // Promotes a paper strategy to live: graduation passed, registry stage live_eligible, account
  // live-enabled, capital cap within 10–20 % of the intended allocation, live limit profile, owner
  // passkey step-up, typed confirmation (GL-020). Actor analyst is denied at every autonomy level.
  rpc PromoteToLive(PromoteToLiveRequest) returns (PromoteToLiveResponse);
  // Demotes a live strategy to paper: cancels its open live orders, keeps or flattens
  // strategy-owned quantity per policy, moves it back to its paper account (GL-030). No step-up;
  // callable by the owner from any device and by the monitor (system containment).
  rpc DemoteFromLive(DemoteFromLiveRequest) returns (DemoteFromLiveResponse);
  // Raises a live strategy's capital cap one ladder step (GL-040): at most 2x, only after a full
  // window with the graduation-style report passing on the live window, passkey step-up.
  rpc RaiseLiveCap(RaiseLiveCapRequest) returns (RaiseLiveCapResponse);

}

// StrategyMode is a strategy's trading mode (SM-012). `live` is only reachable through section 15.
enum StrategyMode {
  STRATEGY_MODE_UNSPECIFIED = 0;
  STRATEGY_MODE_DISABLED = 1;
  // Runs and records intents and decisions; never submits (SM-013).
  STRATEGY_MODE_SHADOW = 2;
  STRATEGY_MODE_PAPER = 3;
  STRATEGY_MODE_LIVE = 4;
  // Automatically or manually stopped; re-enabling is a manual owner action (N4).
  STRATEGY_MODE_HALTED = 5;
}

// RiskLimits are the configurable pre-trade limits for one scope (RM-003). Unset fields inherit the
// next wider scope (strategy → account → global); the tightest applicable limit wins.
message RiskLimits {
  tb.common.v1.Decimal max_order_notional = 1;
  tb.common.v1.Decimal max_order_qty = 2;
  tb.common.v1.Decimal max_position_notional = 3;
  // Fraction of the strategy allocation, e.g. "0.5".
  tb.common.v1.Decimal max_position_pct_allocation = 4;
  tb.common.v1.Decimal max_gross_exposure = 5;
  tb.common.v1.Decimal max_net_exposure = 6;
  int32 max_positions = 7;
  // Fraction of the strategy's gross exposure in one instrument.
  tb.common.v1.Decimal max_concentration_pct = 8;
  // Realized + unrealized − fees for the session (positive number = loss limit, RM-005).
  tb.common.v1.Decimal max_daily_loss = 9;
  // Drawdown from the strategy equity high-water mark.
  tb.common.v1.Decimal max_drawdown = 10;
  int32 max_orders_per_minute = 11;
  int32 max_cancels_per_minute = 12;
  int32 max_consecutive_losses = 13;
  // Limit price band around the last trade, fraction (e.g. "0.02").
  tb.common.v1.Decimal price_collar_pct = 14;
  int32 duplicate_window_seconds = 15;
  // Reject when qty > multiple × the strategy's median recent order size.
  tb.common.v1.Decimal fat_finger_multiple = 16;
  int32 max_open_orders = 17;
}

message Strategy {
  string strategy_id = 1;
  // 6–8 lowercase alphanumerics used in attribution IDs (VP-002); "manual" is reserved.
  string short_id = 2;
  string name = 3;
  tb.common.v1.Horizon horizon = 4;
  StrategyMode mode = 5;
  string broker_account_id = 6;
  string version = 7;
  string code_commit = 8;
  string params_hash = 9;
  // Shorting is allowed only in a dedicated account with no other owners (VP-005).
  bool allow_short = 10;
  // Instruments exempt from Alpaca symbol segregation (RM-014).
  repeated string segregation_allowlist = 11;
  RiskLimits limits = 12;
  string mode_reason = 13;
  int64 updated_at = 14;
  // Hosted by the strategy runtime (dead-man watched, RM-017); false for UI/webhook owners.
  bool runtime_hosted = 15;
  // Section 15 (GL-020): the live capital cap and the allocation it was graduated for. Zero unless
  // the strategy is or was live. The ledger allocation on the live account equals the cap.
  tb.common.v1.Decimal live_capital_cap = 16;
  tb.common.v1.Decimal intended_allocation = 17;
  // Account the strategy traded paper on before promotion; demotion returns it there (GL-030).
  string paper_account_id = 18;
  // Scaling ladder step (0 = initial cap) and when the current step started (GL-040).
  int32 ladder_step = 19;
  int64 ladder_window_start = 20;
  // Set on a paper twin registered by promotion: the live strategy it mirrors (GL-022).
  string paper_twin_of = 21;
  int64 live_promoted_at = 22;
  // Hash of the graduation report and readiness record the promotion was approved on.
  string live_evidence_hash = 23;
}

// ---- Section 15 go-live messages (GL-*).

// ReadinessItem is one entry of the pre-live readiness checklist (GL-010). Automated items are
// evaluated on every read; attested items are marked by the owner. There is no waiver status.
message ReadinessItem {
  string id = 1;
  // security | operations | data | ledger | risk | monitoring | compliance | documentation
  string section = 2;
  string title = 3;
  // pending | passed | failed
  string status = 4;
  bool automated = 5;
  string checked_by = 6;
  int64 checked_at = 7;
  string note = 8;
  string evidence_url = 9;
  // Explanation from the automated evaluation (why it failed), empty otherwise.
  string detail = 10;
}

message LiveReadiness {
  string broker_account_id = 1;
  repeated ReadinessItem items = 2;
  // True only when every item is passed (GL-010).
  bool complete = 3;
  int64 updated_at = 4;
  // SHA-256 of the canonical record; recorded in the enablement audit event.
  string record_hash = 5;
}

// GraduationCriterion is one paper-graduation test (GL-001..GL-003).
message GraduationCriterion {
  string name = 1;
  string required = 2;
  string actual = 3;
  bool passed = 4;
  // execution | ledger | optimizer | monitor
  string source = 5;
  string detail = 6;
}

message GraduationReport {
  string strategy_id = 1;
  repeated GraduationCriterion criteria = 2;
  bool overall = 3;
  int64 computed_at = 4;
  repeated string evidence_links = 5;
  // SHA-256 of the canonical report; PromoteToLive records it (GL-020).
  string report_hash = 6;
  int32 paper_sessions = 7;
  int32 paper_trades = 8;
  // Registry stage name of the strategy's candidate (tb.ml.v1.RegistryStage), empty when unknown.
  string registry_stage = 9;
  // Per-session paper returns (fraction of allocation) the statistics were computed on.
  repeated double paper_session_returns = 10;
  // Window the report covers: first and last paper session (UTC ns).
  int64 window_start = 11;
  int64 window_end = 12;
}

// LiveAccountStatus is one live-environment account as the go-live flow sees it (GL-011).
message LiveAccountStatus {
  string broker_account_id = 1;
  // Audited enablement row (broker.live_enablement): enabled, by whom, audit sequence.
  bool enabled = 2;
  string enabled_by = 3;
  int64 audit_seq = 4;
  int64 updated_at = 5;
  // Adapter session (SESSION_STATE_* name) and whether a live credential is stored.
  string session_state = 6;
  bool credential_stored = 7;
  bool readiness_complete = 8;
  // Unexplained reconciliation breaks open on the account (ledger).
  int32 open_breaks = 9;
  // Live strategies registered to this account.
  repeated string live_strategies = 10;
  // Sessions the adapter has streamed read-only with clean reconciliation (GL-012 read-only day).
  int32 read_only_sessions = 11;
  // Orders allowed (stage trading); enabled alone is the read-only stage.
  bool orders_enabled = 12;
  // paper | live (adapter environment).
  string environment = 13;
}

message LiveStatus {
  // TB_TRADING_LIVE_ENABLED as seen by execution (deploy flag, GL-011).
  bool flag_enabled = 1;
  repeated LiveAccountStatus accounts = 2;
  repeated Strategy live_strategies = 3;
  // Paper strategies that could graduate, with their latest report overall flag.
  repeated GraduationReport candidates = 4;
  int64 as_of = 5;
}

message GetLiveStatusRequest {}

message GetLiveStatusResponse {
  LiveStatus status = 1;
}

message GetLiveReadinessRequest {
  string broker_account_id = 1;
}

message GetLiveReadinessResponse {
  LiveReadiness readiness = 1;
}

message SetReadinessItemRequest {
  string broker_account_id = 1;
  string item_id = 2;
  // passed | failed
  string status = 3;
  string note = 4;
  string evidence_url = 5;
  Actor actor = 6;
}

message SetReadinessItemResponse {
  LiveReadiness readiness = 1;
}

message GetGraduationReportRequest {
  string strategy_id = 1;
}

message GetGraduationReportResponse {
  GraduationReport report = 1;
}

message EnableLiveAccountRequest {
  string broker_account_id = 1;
  // Must equal broker_account_id (typed confirmation, GL-011).
  string confirmation = 2;
  Actor actor = 3;
  // read_only: the live adapter connects, streams account data, and reconciles; orders stay
  // refused (GL-012 live read-only day). trading: orders allowed; needs the complete readiness
  // record, which includes a clean read-only session.
  string stage = 4;
}

message EnableLiveAccountResponse {
  LiveAccountStatus account = 1;
}

message DisableLiveAccountRequest {
  string broker_account_id = 1;
  string reason = 2;
  Actor actor = 3;
}

message DisableLiveAccountResponse {
  LiveAccountStatus account = 1;
  int32 orders_canceled = 2;
  repeated string demoted_strategies = 3;
}

message PromoteToLiveRequest {
  string strategy_id = 1;
  string live_account_id = 2;
  // 10–20 % of intended_allocation (GL-021); becomes the ledger allocation on the live account.
  tb.common.v1.Decimal capital_cap = 3;
  tb.common.v1.Decimal intended_allocation = 4;
  // Optional overrides; every field must be at least as tight as the live profile (GL-023).
  RiskLimits limit_overrides = 5;
  // Must equal the strategy's name (typed confirmation).
  string confirmation = 6;
  // Keep a paper twin running on the paper account as the divergence reference (GL-022, default
  // on: false here means "do not keep").
  bool skip_paper_twin = 7;
  Actor actor = 8;
}

message PromoteToLiveResponse {
  Strategy strategy = 1;
  GraduationReport report = 2;
  RiskLimits live_limits = 3;
  Strategy paper_twin = 4;
}

message DemoteFromLiveRequest {
  string strategy_id = 1;
  string reason = 2;
  // hold | flatten: what happens to strategy-owned live quantity (GL-030); never manual.
  string position_policy = 3;
  Actor actor = 4;
}

message DemoteFromLiveResponse {
  Strategy strategy = 1;
  int32 orders_canceled = 2;
  int32 flatten_intents = 3;
}

message RaiseLiveCapRequest {
  string strategy_id = 1;
  tb.common.v1.Decimal new_cap = 2;
  string confirmation = 3;
  Actor actor = 4;
}

message RaiseLiveCapResponse {
  Strategy strategy = 1;
  GraduationReport live_window_report = 2;
}

message KillSwitch {
  string event_id = 1;
  KillSwitchScope scope = 2;
  string target = 3;
  KillSwitchAction action = 4;
  string engaged_by = 5;
  string reason = 6;
  int64 engaged_at = 7;
  bool latched = 8;
  int64 released_at = 9;
  string released_by = 10;
  // Time from engagement until the last platform cancel was acknowledged (RM-006 target 2 s).
  int64 cancel_completed_ns = 11;
}

// Halt blocks new intents for a strategy (optionally one instrument) until cleared: unknown order
// state (OE-005), reconciliation breaks (VP-008), margin events (RM-013), dead-man (RM-017).
message Halt {
  string halt_id = 1;
  string broker_account_id = 2;
  string strategy_id = 3;
  string instrument_id = 4;
  string reason = 5;
  int64 since = 6;
  int64 cleared_at = 7;
  string source = 8;
}

message IntentRecord {
  OrderIntent intent = 1;
  RiskDecision decision = 2;
  // received | rejected | approved | shadow | submitted | done | failed
  string state = 3;
  int64 received_at = 4;
}

message Fill {
  string broker_account_id = 1;
  string broker_exec_id = 2;
  string order_id = 3;
  string intent_id = 4;
  string strategy_id = 5;
  string instrument_id = 6;
  tb.common.v1.Side side = 7;
  tb.common.v1.Decimal qty = 8;
  tb.common.v1.Decimal price = 9;
  tb.common.v1.Decimal fees = 10;
  int64 event_time = 11;
  string correlation_id = 12;
  string client_order_id = 13;
}

message AccountTradingStatus {
  string broker_account_id = 1;
  // SESSION_STATE_* name from tb.broker.v1.SessionState.
  string session_state = 2;
  // RECONCILIATION_STATUS_* name, and whether it is fresh after the last reconnect (OE-008).
  string reconciliation_status = 3;
  bool reconciliation_fresh = 4;
  bool intraday_margin_deficit = 5;
  bool margin_call = 6;
  int32 day_trade_count = 7;
  // off | legacy (RM-008).
  string pdt_guard = 8;
  bool accepting_intents = 9;
  repeated string blocked_reasons = 10;
  // paper | live
  string environment = 11;
  tb.common.v1.Decimal margin_utilization = 12;
}

message StrategyTradingStatus {
  string strategy_id = 1;
  StrategyMode mode = 2;
  bool accepting_intents = 3;
  repeated string blocked_reasons = 4;
  int64 last_heartbeat = 5;
}

message TradingStatus {
  // running | frozen
  string global_state = 1;
  repeated AccountTradingStatus accounts = 2;
  repeated StrategyTradingStatus strategies = 3;
  repeated KillSwitch active_kill_switches = 4;
  repeated Halt active_halts = 5;
  int64 as_of = 6;
  bool clock_ok = 7;
  // Open platform orders (all accounts).
  int32 open_orders = 8;
  int64 runtime_last_heartbeat = 9;
}

// Actor is the authenticated principal behind an owner action, as established by api-gateway.
message Actor {
  // "owner", "service:<name>", "cli:ops".
  string name = 1;
  // passkey | totp | recovery | "" (no step-up).
  string step_up_method = 2;
  // True when the request came from a mobile client (UI-012: releases are desktop-only).
  bool mobile = 3;
  string ip = 4;
  string device = 5;
}

message SubmitIntentRequest {
  OrderIntent intent = 1;
  Actor actor = 2;
}

message SubmitIntentResponse {
  RiskDecision decision = 1;
  repeated Order orders = 2;
  // True when this intent_id was already processed (idempotent replay).
  bool duplicate = 3;
}

message PreviewIntentRequest {
  OrderIntent intent = 1;
}

message PreviewIntentResponse {
  RiskDecision decision = 1;
  tb.common.v1.Decimal estimated_notional = 2;
  tb.common.v1.Decimal estimated_price = 3;
  // Human-readable ownership note, e.g. "this order affects manual holdings" (UI-016).
  string ownership_note = 4;
}

message CancelIntentRequest {
  string intent_id = 1;
  Actor actor = 2;
}

message CancelIntentResponse {
  int32 canceled = 1;
}

message ListOrdersRequest {
  string broker_account_id = 1;
  string strategy_id = 2;
  bool open_only = 3;
  int64 since = 4;
  int32 limit = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message ListIntentsRequest {
  string strategy_id = 1;
  bool rejected_only = 2;
  int64 since = 3;
  int32 limit = 4;
}

message ListIntentsResponse {
  repeated IntentRecord intents = 1;
}

message ListFillsRequest {
  string broker_account_id = 1;
  string strategy_id = 2;
  int64 since = 3;
  int32 limit = 4;
}

message ListFillsResponse {
  repeated Fill fills = 1;
}

message GetTraceRequest {
  string correlation_id = 1;
}

message GetTraceResponse {
  repeated IntentRecord intents = 1;
  repeated Order orders = 2;
  repeated Fill fills = 3;
}

message ListStrategiesRequest {}

message ListStrategiesResponse {
  repeated Strategy strategies = 1;
}

message RegisterStrategyRequest {
  Strategy strategy = 1;
  Actor actor = 2;
}

message RegisterStrategyResponse {
  Strategy strategy = 1;
}

message SetStrategyModeRequest {
  string strategy_id = 1;
  StrategyMode mode = 2;
  string reason = 3;
  Actor actor = 4;
}

message SetStrategyModeResponse {
  Strategy strategy = 1;
}

message DemoteStrategyRequest {
  string strategy_id = 1;
  string reason = 2;
  // Monitoring report or containment action the demotion is based on (audited).
  string evidence_id = 3;
  Actor actor = 4;
  string correlation_id = 5;
}

message DemoteStrategyResponse {
  Strategy strategy = 1;
  StrategyMode from = 2;
  // False when the strategy was already halted or disabled.
  bool changed = 3;
  // Set for live → paper (the latched strategy kill switch).
  string kill_switch_event_id = 4;
  int32 orders_canceled = 5;
}

message GetRiskLimitsRequest {
  // "global", "account:<id>", "strategy:<id>", or "manual".
  string scope = 1;
}

message GetRiskLimitsResponse {
  string scope = 1;
  RiskLimits limits = 2;
  // Effective limits after inheritance.
  RiskLimits effective = 3;
}

message SetRiskLimitsRequest {
  string scope = 1;
  RiskLimits limits = 2;
  Actor actor = 3;
}

message SetRiskLimitsResponse {
  RiskLimits limits = 1;
  // True when any value was loosened (needs step-up, RM-007).
  bool raised = 2;
}

message TriggerKillSwitchRequest {
  KillSwitchScope scope = 1;
  string target = 2;
  KillSwitchAction action = 3;
  string reason = 4;
  Actor actor = 5;
}

message TriggerKillSwitchResponse {
  KillSwitch kill_switch = 1;
  int32 orders_canceled = 2;
  int32 flatten_intents = 3;
}

message ReleaseKillSwitchRequest {
  string event_id = 1;
  string reason = 2;
  Actor actor = 3;
}

message ReleaseKillSwitchResponse {
  KillSwitch kill_switch = 1;
}

message ListKillSwitchesRequest {
  bool active_only = 1;
}

message ListKillSwitchesResponse {
  repeated KillSwitch kill_switches = 1;
}

message GetTradingStatusRequest {}

message GetTradingStatusResponse {
  TradingStatus status = 1;
}
