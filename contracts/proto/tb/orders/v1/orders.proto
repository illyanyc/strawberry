syntax = "proto3";

// Order path contracts (bus subjects ord.*, exec.*, risk.kill). Durable, at-least-once;
// consumers MUST be idempotent on intent_id, client_order_id, and broker_exec_id.
package tb.orders.v1;

import "tb/common/v1/common.proto";

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  ORDER_TYPE_TRAILING_STOP = 5;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
  TIME_IN_FORCE_GTC = 2;
  TIME_IN_FORCE_IOC = 3;
  TIME_IN_FORCE_FOK = 4;
  TIME_IN_FORCE_OPG = 5;
  TIME_IN_FORCE_CLS = 6;
}

// OrderIntent is what a strategy or the owner wants; it becomes an order only after a RiskDecision.
message OrderIntent {
  string intent_id = 1;
  // Strategy ID, or "manual" for owner-entered orders.
  string strategy_id = 2;
  string broker_account_id = 3;
  string instrument_id = 4;
  tb.common.v1.Side side = 5;
  // Exactly one of quantity or target_position is set.
  oneof sizing {
    tb.common.v1.Decimal quantity = 6;
    tb.common.v1.Decimal target_position = 7;
  }
  OrderType order_type = 8;
  tb.common.v1.Decimal limit_price = 9;
  tb.common.v1.Decimal stop_price = 10;
  TimeInForce tif = 11;
  string reason = 12;
  tb.common.v1.Mode mode = 13;
  string correlation_id = 14;
  int64 created_at = 15;
}

message RiskCheck {
  string name = 1;
  bool passed = 2;
  string value = 3;
  string limit = 4;
  string detail = 5;
}

message RiskDecision {
  string intent_id = 1;
  bool approved = 2;
  repeated RiskCheck checks = 3;
  int64 decided_at = 4;
  string correlation_id = 5;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_PENDING_SUBMIT = 1;
  ORDER_STATE_SUBMITTED = 2;
  ORDER_STATE_ACCEPTED = 3;
  ORDER_STATE_PARTIALLY_FILLED = 4;
  ORDER_STATE_FILLED = 5;
  ORDER_STATE_PENDING_CANCEL = 6;
  ORDER_STATE_CANCELED = 7;
  ORDER_STATE_REJECTED = 8;
  ORDER_STATE_EXPIRED = 9;
  // Broker state cannot be confirmed; fail closed until reconciled (N5).
  ORDER_STATE_UNKNOWN = 10;
  // Superseded by a replacement order (cancel/replace); the replacement carries the new state.
  ORDER_STATE_REPLACED = 11;
  ORDER_STATE_PENDING_REPLACE = 12;
}

message Order {
  string order_id = 1;
  string intent_id = 2;
  // Attribution ID: tb1-<strategyShortId>-<intentULID>-<attempt> (rule VP-002).
  string client_order_id = 3;
  string broker_order_id = 4;
  string broker_account_id = 5;
  string strategy_id = 6;
  string instrument_id = 7;
  tb.common.v1.Side side = 8;
  tb.common.v1.Decimal quantity = 9;
  OrderState state = 10;
  tb.common.v1.Decimal filled_qty = 11;
  tb.common.v1.Decimal avg_price = 12;
  tb.common.v1.Mode mode = 13;
  int64 created_at = 14;
  int64 submitted_at = 15;
  int64 updated_at = 16;
  string correlation_id = 17;
  // IBKR permId, the durable broker key (V1); empty for other brokers.
  string perm_id = 18;
}

message ExecutionReport {
  string broker_account_id = 1;
  string broker_exec_id = 2;
  string client_order_id = 3;
  string broker_order_id = 4;
  string instrument_id = 5;
  tb.common.v1.Side side = 6;
  tb.common.v1.Decimal qty = 7;
  tb.common.v1.Decimal price = 8;
  tb.common.v1.Decimal fees = 9;
  int64 event_time = 10;
  tb.common.v1.Mode mode = 11;
  int64 ingested_at = 12;
  // IBKR permId of the order (durable join key, V1).
  string perm_id = 13;
  // Ticker at execution time (display; instrument_id is the key, may be empty if unmapped).
  string symbol = 14;
  tb.common.v1.Broker broker = 15;
  // Broker-provided ordering hint for executions with equal event_time (OE-006).
  int64 sequence = 16;
  string fee_currency = 17;
  string correlation_id = 18;
}

enum KillSwitchScope {
  KILL_SWITCH_SCOPE_UNSPECIFIED = 0;
  KILL_SWITCH_SCOPE_GLOBAL = 1;
  KILL_SWITCH_SCOPE_BROKER_ACCOUNT = 2;
  KILL_SWITCH_SCOPE_STRATEGY = 3;
  KILL_SWITCH_SCOPE_INSTRUMENT = 4;
}

enum KillSwitchAction {
  KILL_SWITCH_ACTION_UNSPECIFIED = 0;
  KILL_SWITCH_ACTION_FREEZE = 1;
  KILL_SWITCH_ACTION_CANCEL_OPEN = 2;
  // Closes strategy-owned quantity only; never manual holdings (rules RM-006, VP-006).
  KILL_SWITCH_ACTION_FLATTEN_STRATEGY_OWNED = 3;
  KILL_SWITCH_ACTION_RELEASE = 4;
}

message KillSwitchEvent {
  string event_id = 1;
  KillSwitchScope scope = 2;
  // Target identifier for the scope (account, strategy, or instrument ID); empty for global.
  string target = 3;
  KillSwitchAction action = 4;
  string actor = 5;
  string reason = 6;
  int64 occurred_at = 7;
  string correlation_id = 8;
}
