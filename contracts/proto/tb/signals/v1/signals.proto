syntax = "proto3";

// Model, rule, or webhook signals (bus subject sig.<strategy_id>.<instrument_id>, stream SIGNALS).
// Signals are never orders: a strategy turns them into intents that pass the pre-trade gate.
package tb.signals.v1;

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_LONG = 1;
  DIRECTION_SHORT = 2;
  DIRECTION_FLAT = 3;
}

message Signal {
  string signal_id = 1;
  string strategy_id = 2;
  string model_version = 3;
  string instrument_id = 4;
  int64 as_of = 5;
  Direction direction = 6;
  double score = 7;
  double probability = 8;
  // Holding horizon in nanoseconds.
  int64 horizon = 9;
  string feature_snapshot_id = 10;
  string correlation_id = 11;
}

// RuntimeHeartbeat is published by the strategy runtime on sys.health.strategy-runtime (core NATS)
// every few seconds and after every processed bar batch. Execution's dead-man check watches it
// (RM-017); tests use last_bar_available_at to know a bar was processed.
message RuntimeHeartbeat {
  string runtime_id = 1;
  repeated string strategy_ids = 2;
  // available_at of the newest bar processed, UTC ns.
  int64 last_bar_available_at = 3;
  int64 bars_processed = 4;
  int64 intents_published = 5;
  int64 sent_at = 6;
  string version = 7;
}
