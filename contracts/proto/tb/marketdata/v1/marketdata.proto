syntax = "proto3";

// Market data records produced by `marketdata` (bus subjects md.*, lake, cache).
package tb.marketdata.v1;

import "tb/common/v1/common.proto";

enum Timeframe {
  TIMEFRAME_UNSPECIFIED = 0;
  TIMEFRAME_1M = 1;
  TIMEFRAME_5M = 2;
  TIMEFRAME_15M = 3;
  TIMEFRAME_1H = 4;
  TIMEFRAME_1D = 5;
  TIMEFRAME_30M = 6;
}

// AdjustmentBasis records what a price series is adjusted for (D27). The lake stores RAW only;
// SPLIT and SPLIT_DIV appear on read-time adjusted outputs.
enum AdjustmentBasis {
  ADJUSTMENT_BASIS_UNSPECIFIED = 0;
  ADJUSTMENT_BASIS_RAW = 1;
  ADJUSTMENT_BASIS_SPLIT = 2;
  ADJUSTMENT_BASIS_SPLIT_DIV = 3;
}

// Session of a bar (MD-004): extended-hours bars are flagged, never merged with regular bars.
enum Session {
  SESSION_UNSPECIFIED = 0;
  SESSION_PRE = 1;
  SESSION_REGULAR = 2;
  SESSION_POST = 3;
}

// AgreementStatus of a corporate action across sources (MD-012).
enum AgreementStatus {
  AGREEMENT_STATUS_UNSPECIFIED = 0;
  // Seen in one source only; usable but flagged.
  AGREEMENT_STATUS_SINGLE_SOURCE = 1;
  AGREEMENT_STATUS_AGREED = 2;
  // Sources disagree on type, date, or ratio; adjustment is blocked for the symbol (MD-012).
  AGREEMENT_STATUS_DISAGREED = 3;
}

// Bar is raw (unadjusted) OHLCV (rule DF-005). Available at ts_close plus the feed's publication delay.
message Bar {
  string instrument_id = 1;
  Timeframe timeframe = 2;
  int64 ts_open = 3;
  int64 ts_close = 4;
  tb.common.v1.Decimal open = 5;
  tb.common.v1.Decimal high = 6;
  tb.common.v1.Decimal low = 7;
  tb.common.v1.Decimal close = 8;
  tb.common.v1.Decimal volume = 9;
  tb.common.v1.Decimal vwap = 10;
  int64 trade_count = 11;
  // Source feed, e.g. "alpaca.iex", "alpaca.sip", "ibkr", "fmp".
  string feed = 12;
  // False for live partial bars; partial bars are never written to the lake as final (DF-007).
  bool is_final = 13;
  int64 available_at = 14;
  int64 ingested_at = 15;
  // Vendor, e.g. "alpaca", "fmp".
  string source = 16;
  // 0 for the first version of a natural key (instrument_id, timeframe, ts_open, feed); each
  // content change increments it, and earlier revisions are retained (DF-007, ST-004).
  int32 revision = 17;
  AdjustmentBasis adjustment_basis = 18;
  Session session = 19;
  // True when the bar was recovered from REST after a stream gap (MD-006).
  bool repaired = 20;
  // Ticker as of ts_open (display only; instrument_id is the key). Vendor-shaped records from
  // broker-gateway carry symbol with an empty instrument_id.
  string symbol = 21;
}

message Quote {
  string instrument_id = 1;
  int64 event_time = 2;
  tb.common.v1.Decimal bid_price = 3;
  tb.common.v1.Decimal bid_size = 4;
  tb.common.v1.Decimal ask_price = 5;
  tb.common.v1.Decimal ask_size = 6;
  repeated string conditions = 7;
  string feed = 8;
  int64 available_at = 9;
  int64 ingested_at = 10;
  string symbol = 11;
}

message Trade {
  string instrument_id = 1;
  int64 event_time = 2;
  tb.common.v1.Decimal price = 3;
  tb.common.v1.Decimal size = 4;
  repeated string conditions = 5;
  string feed = 6;
  int64 available_at = 7;
  int64 ingested_at = 8;
  string symbol = 9;
  string trade_id = 10;
  string exchange = 11;
}

enum CorporateActionType {
  CORPORATE_ACTION_TYPE_UNSPECIFIED = 0;
  CORPORATE_ACTION_TYPE_SPLIT = 1;
  CORPORATE_ACTION_TYPE_DIVIDEND = 2;
  CORPORATE_ACTION_TYPE_SYMBOL_CHANGE = 3;
  CORPORATE_ACTION_TYPE_DELISTING = 4;
  CORPORATE_ACTION_TYPE_MERGER = 5;
  CORPORATE_ACTION_TYPE_SPIN_OFF = 6;
}

message CorporateAction {
  string instrument_id = 1;
  CorporateActionType type = 2;
  // Ex-date as UTC ns at 00:00 exchange-local converted to UTC.
  int64 ex_date = 3;
  // Split ratio (new/old) or other ratio, when applicable.
  tb.common.v1.Decimal ratio = 4;
  // Cash amount per share, when applicable.
  tb.common.v1.Decimal amount = 5;
  // New symbol or successor instrument for symbol changes and mergers.
  string successor_instrument_id = 6;
  string source = 7;
  // When the platform could first know the action: the vendor's declaration/announcement time when
  // known, otherwise the first fetch time (DF-005: as-of adjustment uses only actions with
  // available_at <= as_of).
  int64 available_at = 8;
  int64 ingested_at = 9;
  string symbol = 10;
  // New ticker for symbol changes.
  string new_symbol = 11;
  int64 record_date = 12;
  int64 payable_date = 13;
  // Vendor declaration/announcement date, UTC ns (0 if unknown).
  int64 declared_at = 14;
  // Vendor's own identifier, for idempotent upserts.
  string source_id = 15;
  AgreementStatus agreement = 16;
  // Sources that reported this action after cross-checking (e.g. ["alpaca", "fmp"]).
  repeated string sources = 17;
}

// MarketDataService is served by marketdata (section 05, ADR-0022). Callers: api-gateway (UI,
// operator), execution (IsFresh before every order, RM-004), monitor.
service MarketDataService {
  // Starts (or resumes) a resumable, idempotent backfill job; returns immediately.
  rpc Backfill(BackfillRequest) returns (BackfillResponse);
  rpc GetBackfillStatus(GetBackfillStatusRequest) returns (GetBackfillStatusResponse);
  // Replaces the active streaming universe without a restart (MD-009).
  rpc SetUniverse(SetUniverseRequest) returns (SetUniverseResponse);
  rpc GetFeedStatus(GetFeedStatusRequest) returns (GetFeedStatusResponse);
  // Whether the latest final bar is recent enough to trade on (MD-007). Fails closed: unknown
  // instruments and stalled feeds are not fresh.
  rpc IsFresh(IsFreshRequest) returns (IsFreshResponse);
  // Recent final bars for charts (UI-010), newest last, served from the hot-cache ring (ST-009:
  // at most 500 bars per timeframe); lake-backed history is Planned.
  rpc GetBars(GetBarsRequest) returns (GetBarsResponse);
  // Current tickers to instrument IDs from the instrument master (UI order ticket and charts,
  // UI-011). Exact matches only; positions and orders are always keyed by instrument_id.
  rpc ResolveSymbols(ResolveSymbolsRequest) returns (ResolveSymbolsResponse);
}

message ResolveSymbolsRequest {
  repeated string symbols = 1;
}

message SymbolMatch {
  string symbol = 1;
  string instrument_id = 2;
}

message ResolveSymbolsResponse {
  repeated SymbolMatch matches = 1;
  repeated string unknown = 2;
}

message GetBarsRequest {
  string instrument_id = 1;
  Timeframe timeframe = 2;
  // Optional window, UTC ns on ts_open; 0 = unbounded.
  int64 start = 3;
  int64 end = 4;
  int32 limit = 5;
}

message GetBarsResponse {
  repeated Bar bars = 1;
  // "cache" in Phase 2.
  string source = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  // Finished, but some chunks have unrepaired gaps or data-quality findings (see the report).
  JOB_STATE_SUCCEEDED_WITH_GAPS = 5;
}

message BackfillRequest {
  // Instrument IDs; empty means the named universe.
  repeated string instrument_ids = 1;
  string universe = 2;
  repeated Timeframe timeframes = 3;
  int64 start = 4;
  int64 end = 5;
  // Source, e.g. "alpaca.sip", "alpaca.iex", "fmp".
  string source = 6;
  string requested_by = 7;
}

message BackfillResponse {
  string job_id = 1;
}

message GetBackfillStatusRequest {
  string job_id = 1;
}

message BackfillReport {
  int64 chunks_total = 1;
  int64 chunks_done = 2;
  int64 rows_fetched = 3;
  // Rows that were new after compaction (a rerun reports 0, ST-004).
  int64 rows_added = 4;
  int64 rows_revised = 5;
  int64 gaps_found = 6;
  int64 gaps_repaired = 7;
  // Missing bars the source confirmed it does not have (e.g. no trades), recorded as coverage gaps.
  int64 gaps_confirmed_missing = 8;
  map<string, int64> dq_findings = 9;
}

message GetBackfillStatusResponse {
  string job_id = 1;
  JobState state = 2;
  BackfillReport report = 3;
  string error = 4;
  int64 started_at = 5;
  int64 finished_at = 6;
}

message SetUniverseRequest {
  string universe = 1;
  repeated string instrument_ids = 2;
}

message SetUniverseResponse {
  int32 subscribed = 1;
}

message FeedStatus {
  string feed = 1;
  bool connected = 2;
  int64 last_message_at = 3;
  int64 lag_ms = 4;
  repeated string symbols_stale = 5;
  string state = 6;
}

message GetFeedStatusRequest {}

message GetFeedStatusResponse {
  repeated FeedStatus feeds = 1;
}

message IsFreshRequest {
  string instrument_id = 1;
  Timeframe timeframe = 2;
  // Maximum age of the latest final bar's close, ns; 0 = two bar intervals (RM-004 default).
  int64 max_age = 3;
}

message IsFreshResponse {
  bool fresh = 1;
  int64 last_bar_close = 2;
  string reason = 3;
}

// SourceHealth is published on sys.health.<source> by marketdata (and context-data) (MD-008).
message SourceHealth {
  string source = 1;
  int64 last_message_age_ms = 2;
  int64 gap_count = 3;
  double error_rate = 4;
  string breaker_state = 5;
  string reconciliation_status = 6;
  int64 as_of = 7;
}
