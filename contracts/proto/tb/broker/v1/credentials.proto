syntax = "proto3";

// Write-only broker credential management, served by `broker-gateway` only.
// There is deliberately no RPC that returns plaintext credentials (rule SE-031): plaintext is
// decrypted only inside broker-gateway for its own adapters.
package tb.broker.v1;

import "tb/common/v1/common.proto";

service CredentialService {
  // Stores (or replaces) the credential for an account/environment.
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  // Deletes the credential for an account/environment.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  // Lists credential metadata (never secret material).
  rpc ListCredentialStatus(ListCredentialStatusRequest) returns (ListCredentialStatusResponse);
}

// Environment is cryptographically bound into the ciphertext (AAD), so a paper credential can
// never be decrypted as live (rule SE-030).
enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_PAPER = 1;
  ENVIRONMENT_LIVE = 2;
}

message PutCredentialRequest {
  string broker_account_id = 1;
  tb.common.v1.Broker broker = 2;
  Environment environment = 3;
  // Opaque key/value secret material (e.g. api_key_id, api_secret). Never logged.
  map<string, string> secret = 4;
  // Actor on whose behalf the caller acts (e.g. "owner"), for the audit record.
  string on_behalf_of = 5;
  string correlation_id = 6;
}

message PutCredentialResponse {
  CredentialStatus status = 1;
}

message DeleteCredentialRequest {
  string broker_account_id = 1;
  Environment environment = 2;
  string on_behalf_of = 3;
  string correlation_id = 4;
}

message DeleteCredentialResponse {}

message ListCredentialStatusRequest {}

message ListCredentialStatusResponse {
  repeated CredentialStatus credentials = 1;
}

message CredentialStatus {
  string broker_account_id = 1;
  tb.common.v1.Broker broker = 2;
  Environment environment = 3;
  // Names of the stored secret fields (never values).
  repeated string fields = 4;
  int64 created_at = 5;
  int64 rotated_at = 6;
  string kek_id = 7;
}
