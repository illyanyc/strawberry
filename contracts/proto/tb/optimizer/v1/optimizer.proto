// Effective deployment limits for a lineage: the horizon profile from the optimizer's config
// (TB_OPT_DEPLOYMENT_LIMITS) overlaid with the owner's per-lineage override (EX-062).
message DeploymentLimits {
  string lineage_id = 1;
  // intraday | swing
  string horizon = 2;
  tb.orders.v1.RiskLimits limits = 3;
  // Decimal string, currency of the broker account.
  string allocation = 4;
  // profile:<horizon> | lineage
  string source = 5;
  int64 updated_at = 6;
  string updated_by = 7;
}

message GetDeploymentLimitsRequest {
  string lineage_id = 1;
}

message GetDeploymentLimitsResponse {
  DeploymentLimits limits = 1;
  // The horizon profile alone, for comparison in the UI.
  DeploymentLimits profile = 2;
}

message SetDeploymentLimitsRequest {
  string lineage_id = 1;
  // Unset fields keep the profile value.
  tb.orders.v1.RiskLimits limits = 2;
  string allocation = 3;
  tb.ml.v1.CallerContext caller = 4;
}

message SetDeploymentLimitsResponse {
  DeploymentLimits limits = 1;
  // True when the change raised a limit or the allocation (and therefore needed step-up).
  bool raised = 2;
}
