[project]
name = "tbcontracts"
version = "0.0.0"
description = "Generated Python messages for contracts/proto. Do not edit src/ by hand; run `make gen`."
requires-python = ">=3.12,<3.13"
dependencies = ["protobuf==7.36.2"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb"]
