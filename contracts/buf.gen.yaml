version: v2
# Local plugins only (installed by `make tools` / pnpm), so generation is deterministic and
# works offline. Python uses protoc's built-in generators (protoc is pinned in tools/versions.env).
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/illyanyc/strawberry/contracts/gen/go
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  - protoc_builtin: python
    protoc_path: ../.tools/bin/protoc
    out: gen/python/src
  - protoc_builtin: pyi
    protoc_path: ../.tools/bin/protoc
    out: gen/python/src
  - local: ["node", "gen/ts/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: gen/ts/src
    opt: target=ts
