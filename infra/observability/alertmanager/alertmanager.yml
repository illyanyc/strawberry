# Alert routing (D13, D22). Critical alerts page through Pushover emergency priority (repeats until
# acknowledged). Fill in .secrets/pushover_user_key and pushover_app_token to enable delivery; until
# then sends fail and are logged. Every notifying receiver also posts to the gateway's internal
# webhook, which fans the group out as Web Push to the installed PWA (ADR-0053, SE-063).
route:
  receiver: log-only
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    # Critical alerts always page (quiet hours never apply), repeating until acknowledged.
    - matchers: [severity="critical"]
      receiver: pushover-critical
      repeat_interval: 30m
    # Daily reports from the monitor (pre-market checklist, end-of-day summary), normal priority.
    - matchers: [kind="report"]
      receiver: pushover-report
      group_wait: 0s
      repeat_interval: 24h
    # Warnings notify at normal priority outside quiet hours (section 13: quiet hours never
    # suppress critical).
    - matchers: [severity="warning"]
      receiver: pushover-warning
      mute_time_intervals: [quiet-hours]

time_intervals:
  - name: quiet-hours
    time_intervals:
      - times: [{ start_time: "22:00", end_time: "24:00" }, { start_time: "00:00", end_time: "07:00" }]
        location: America/New_York

receivers:
  - name: log-only
  - name: pushover-warning
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user_key
        token_file: /run/secrets/pushover_app_token
        priority: "0"
        title: '[WARNING] {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    webhook_configs:
      - url: http://api-gateway:8082/internal/alertmanager/webhook
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization: { type: Bearer, credentials_file: /run/secrets/alertmanager_webhook_token }
  - name: pushover-report
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user_key
        token_file: /run/secrets/pushover_app_token
        priority: "-1"
        title: '{{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    webhook_configs:
      - url: http://api-gateway:8082/internal/alertmanager/webhook
        send_resolved: false
        max_alerts: 20
        http_config:
          authorization: { type: Bearer, credentials_file: /run/secrets/alertmanager_webhook_token }
  - name: pushover-critical
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user_key
        token_file: /run/secrets/pushover_app_token
        priority: "2"
        retry: 2m
        expire: 1h
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
        send_resolved: true
    webhook_configs:
      - url: http://api-gateway:8082/internal/alertmanager/webhook
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization: { type: Bearer, credentials_file: /run/secrets/alertmanager_webhook_token }

inhibit_rules:
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [severity="warning"]
    equal: [stack]
