# NATS JetStream (D2, ADR-0008). Users and permissions come from the generated secret users.conf.
server_name: tb-nats
port: 4222
http_port: 8222
max_payload: 1MB

jetstream {
  store_dir: /data
  # Mandatory (research D2): fsync every write. The default 2-minute interval lost ~14% of
  # acknowledged writes on power loss in Jepsen testing, which a home host must survive.
  sync_interval: always
  max_memory_store: 1GB
  max_file_store: 20GB
}

include users.conf
