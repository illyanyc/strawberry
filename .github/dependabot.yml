# Automated dependency update PRs (section 02 Stage A supply chain).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directories:
      - /contracts/gen/go
      - /libs/go
      - /services/api-gateway
      - /services/broker-gateway
      - /services/execution
      - /services/ledger
      - /services/marketdata
      - /tests/e2e
      - /tools/tbctl
    schedule: { interval: weekly }
    groups:
      go-minor: { update-types: [minor, patch] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directories:
      - /infra/docker
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule: { interval: weekly }
