[project]
name = "tbcore"
version = "0.0.0"
description = "Shared Python library: service template, logging with redaction, secrets, lake query layer, data quality, the feature store, labels, backtests, validation, and the ML model zoo."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "prometheus-client==0.26.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "tbcontracts",
  # Storage and feature store (section 03, ADR-0020): pinned majors (DuckDB 1.5.x, Polars 1.x).
  "duckdb==1.5.6",
  "polars==1.44.2",
  "pyarrow==26.0.0",
  "numpy==2.5.4",
  # Service-token signing for Python gRPC clients (tbcore.svcauth, SE-040).
  "cryptography==50.0.2",
  # ML model zoo shared by training, backtests, and live inference (section 10, ADR-0036, D23).
  "lightgbm==4.7.0",
  # Generic gRPC handlers and clients built from proto descriptors (tbcore.rpc, ADR-0035).
  "grpcio==1.84.0",
  # Postgres stores for run summaries, the trial ledger, the registry, and audit (ADR-0037).
  "psycopg[binary]==3.3.6",
  # MLflow REST tracking client (ADR-0037).
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbcore"]

[tool.uv.sources]
tbcontracts = { workspace = true }
