[project]
name = "tbcore"
version = "0.0.0"
description = "Shared Python library: service template, config, logging with redaction, secrets (later: instruments, calendar, features, labels, splitters, cost models, strategy API)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "prometheus-client==0.26.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "tbcontracts",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbcore"]

[tool.uv.sources]
tbcontracts = { workspace = true }
