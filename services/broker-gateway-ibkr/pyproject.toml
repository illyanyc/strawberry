[project]
name = "broker-gateway-ibkr"
version = "0.0.0"
description = "IBKR adapter: IB Gateway session supervision, orders, executions, account data, and paced market data over ib_async (section 04, D1, D18)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tbcore",
  "tbcontracts",
  "ib_async==2.1.0",
  "nats-py==2.16.0",
  "grpcio==1.84.0",
  "grpcio-status==1.84.0",
  "cryptography==50.0.2",
  "asyncpg==0.32.0",
]

[project.scripts]
broker-gateway-ibkr = "tb_broker_ibkr.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_broker_ibkr"]

[tool.uv.sources]
tbcore = { workspace = true }
tbcontracts = { workspace = true }
