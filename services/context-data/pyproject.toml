[project]
name = "context-data"
version = "0.0.0"
description = "News, sentiment, macro, earnings, regime series (section 09, Phase 3)"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore"]

[project.scripts]
context-data = "tb_context_data.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_context_data"]

[tool.uv.sources]
tbcore = { workspace = true }
