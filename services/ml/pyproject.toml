[project]
name = "ml"
version = "0.0.0"
description = "Training and inference workers (section 10, Phase 4); native launchd on macOS (D29)"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore", "tbcontracts", "nats-py==2.16.0"]

[project.scripts]
ml = "tb_ml.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_ml"]

[tool.uv.sources]
tbcore = { workspace = true }
tbcontracts = { workspace = true }
