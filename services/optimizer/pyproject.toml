[project]
name = "optimizer"
version = "0.0.0"
description = "Studies, holdout discipline, champion/challenger (section 11, Phase 4)"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore", "tbcontracts", "backtest", "optuna==5.0.0", "nats-py==2.16.0"]

[project.scripts]
optimizer = "tb_optimizer.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_optimizer"]

[tool.uv.sources]
tbcore = { workspace = true }
tbcontracts = { workspace = true }
backtest = { workspace = true }
