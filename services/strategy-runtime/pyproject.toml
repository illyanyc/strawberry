[project]
name = "strategy-runtime"
version = "0.0.0"
description = "Strategy runtime (section 07, ADR-0026): runs tbcore.strategy strategies on final bars and publishes order intents to execution"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore", "tbcontracts", "nats-py==2.16.0"]

[project.scripts]
strategy-runtime = "tb_strategy_runtime.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_strategy_runtime"]

[tool.uv.sources]
tbcore = { workspace = true }
tbcontracts = { workspace = true }
