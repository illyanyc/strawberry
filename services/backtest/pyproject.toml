[project]
name = "backtest"
version = "0.0.0"
description = "Vectorized and event-driven backtests on tbcore (section 08, Phase 3)"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore"]

[project.scripts]
backtest = "tb_backtest.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_backtest"]

[tool.uv.sources]
tbcore = { workspace = true }
