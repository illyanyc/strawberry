[project]
name = "assistant"
version = "0.0.0"
description = "LLM research assistant with constrained tools (section 12, Phase 4)"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore"]

[project.scripts]
assistant = "tb_assistant.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_assistant"]

[tool.uv.sources]
tbcore = { workspace = true }
