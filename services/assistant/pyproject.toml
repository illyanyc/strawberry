[project]
name = "assistant"
version = "0.0.0"
description = "LLM research assistant with constrained tools (section 12, Phase 4)"
requires-python = ">=3.12,<3.13"
dependencies = ["tbcore", "tbcontracts", "httpx==0.28.1", "nats-py==2.16.0", "grpcio==1.84.0", "asyncpg==0.32.0"]

[project.scripts]
assistant = "tb_assistant.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_assistant"]

[tool.uv.sources]
tbcore = { workspace = true }
tbcontracts = { workspace = true }
